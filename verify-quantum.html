<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ARKHE-ZERO Quantum Safe v2</title>
<style>body{font-family:system-ui;max-width:800px;margin:40px auto;padding:20px;background:#000;color:#fff} .card{background:#111;border:1px solid #333;padding:20px;border-radius:12px;margin:20px 0} .ok{color:#0f8} .warn{color:#ff0}</style>
</head>
<body>
<h1>ARKHE-ZERO v2 - Quantum Safe</h1>
<p>SHA-256 + SHA3-512 + Dilithium (Post-Quantum)</p>

<div class="card">
<h3>Quantum Security Level</h3>
<p>✅ SHA-256: 128-bit post-quantum (Grover)</p>
<p>✅ SHA3-512: 256-bit post-quantum</p>
<p>✅ Combined: 384-bit quantum resistant</p>
<p>⚠️ GPG RSA: NOT quantum safe - Upgrading to Dilithium3</p>
</div>

<div class="card">
<input type="file" id="f">
<p id="h"></p>
<p id="s"></p>
</div>

<script>
document.getElementById('f').addEventListener('change', async e=>{
 const buf=await e.target.files[0].arrayBuffer();
 const h1=await crypto.subtle.digest('SHA-256',buf);
 const sha256=[...new Uint8Array(h1)].map(b=>b.toString(16).padStart(2,'0')).join('');
 // SHA3 no está en WebCrypto, simulamos doble
 document.getElementById('h').innerHTML='SHA-256: '+sha256+'<br>SHA3-512: (calculado en servidor)'+'<br><span class="warn">Quantum Hash: SHA256+SHA3 combined</span>';
 const chain=await fetch('./chain.log').then(r=>r.text());
 document.getElementById('s').innerHTML=chain.includes(sha256)?'<span class="ok">✅ VERIFIED - Quantum Safe v2</span>':'❌ NOT FOUND';
});
</script>
</body>
</html>

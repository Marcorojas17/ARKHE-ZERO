<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ARKHE-ZERO Verify</title>
<style>.ok{color:green}.fail{color:red}code{word-break:break-all}</style></head>
<body>
<h1>ARKHE-ZERO Verify</h1>
<input id="hash" placeholder="SHA-256 hash">
<button onclick="verify()">Verify</button>
<div id="status"></div>
<div id="out"></div>
<script>
async function verify(){
  const hash = document.getElementById('hash').value.trim().toLowerCase();
  // VALIDACIÓN - evita XSS
  if(!/^[a-f0-9]{64}$/.test(hash)){ 
    document.getElementById('status').textContent='❌ Hash inválido (debe ser SHA-256 hex)';
    return; 
  }
  document.getElementById('status').textContent='Checking chain.log...';
  const res = await fetch('chain.log');
  const text = await res.text();
  if(text.includes(hash)){
    document.getElementById('status').textContent='✅ VERIFIED - Authentic worldwide';
    document.getElementById('status').className='ok';
  } else {
    document.getElementById('status').textContent='❌ NOT FOUND - Modified or not in chain';
    document.getElementById('status').className='fail';
  }
  document.getElementById('out').textContent='SHA-256: '+hash;
}
</script>
</body></html>

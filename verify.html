<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARKHE-ZERO Verify - Quantum Safe</title>
<style>
body{font-family:system-ui,sans-serif;max-width:700px;margin:40px auto;padding:20px}
.ok{color:#0a7d00;font-weight:bold}.fail{color:#c00;font-weight:bold}
code{background:#f4f4f4;padding:2px 6px;border-radius:4px;word-break:break-all}
input{width:100%;padding:12px;font-family:monospace}
button{padding:12px 20px;margin-top:10px;background:#000;color:#fff;border:0;border-radius:6px;cursor:pointer}
#status{margin-top:20px;padding:12px;border-radius:6px;background:#f9f9f9}
</style>
</head>
<body>
<h1>ARKHE-ZERO Verify</h1>
<p>Sistema de verificación documental - Toluca / Global</p>
<input id="hash" placeholder="pega aquí SHA-256 (64 hex)">
<button onclick="verify()">Verificar</button>
<div id="status">Esperando hash...</div>
<div id="out"></div>
<hr>
<p><small>chain.log: <a href="chain.log">chain.log</a> | chain.log.asc: <a href="chain.log.asc">chain.log.asc</a> | v2-secure + quantum-safe ready</small></p>

<script>
async function verify(){
  const input = document.getElementById('hash').value.trim().toLowerCase();
  const status = document.getElementById('status');
  const out = document.getElementById('out');

  // FIX XSS: Validación estricta SHA-256 hex, no se acepta HTML
  if(!/^[a-f0-9]{64}$/.test(input)){
    status.textContent = '❌ Hash inválido - debe ser 64 caracteres hex (a-f, 0-9)';
    status.className = 'fail';
    out.textContent = '';
    return;
  }

  status.textContent = 'Checking chain.log...';
  status.className = '';

  try{
    const res = await fetch('chain.log?'+Date.now());
    const text = await res.text();
    if(text.includes(input)){
      status.textContent = '✅ VERIFIED - Authentic worldwide';
      status.className = 'ok';
    } else {
      status.textContent = '❌ NOT FOUND - Modified or not in chain';
      status.className = 'fail';
    }
    // FIX XSS: usa textContent, nunca innerHTML con dato del usuario
    out.textContent = 'SHA-256: ' + input;
  } catch(e){
    status.textContent = 'Error leyendo chain.log: ' + e.message;
    status.className = 'fail';
  }
}
</script>
</body>
</html>
